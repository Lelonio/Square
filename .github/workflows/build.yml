name: Build

# Every push to master and every pull request gets an APK, so a change can be
# tried on a phone without building it by hand. No signing secrets here: with
# no keystore the build signs with the debug key, and GitHub does not hand
# secrets to pull requests from forks anyway.
on:
  push:
    branches: [master, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Native unit tests
        run: cargo test --manifest-path native/Cargo.toml --lib

      - name: Unit tests
        run: ./gradlew :app:testDevUnitTest --stacktrace

      # The same three APKs a release has: arm64, 32-bit and universal. A
      # local build makes arm64 alone; see allAbis in app/build.gradle.kts.
      - name: Build
        run: ./gradlew :app:assembleDev -Psquare.allAbis=true --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: square-dev-${{ github.sha }}
          path: |
            app/build/outputs/apk/dev/app-arm64-v8a-dev.apk
            app/build/outputs/apk/dev/app-armeabi-v7a-dev.apk
            app/build/outputs/apk/dev/app-universal-dev.apk
          retention-days: 14
          if-no-files-found: error
