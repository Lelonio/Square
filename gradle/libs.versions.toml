[versions]
agp = "8.13.2"
kotlin = "2.3.21"
composeBom = "2026.06.01"
media3 = "1.5.1"
coroutines = "1.9.0"
lifecycle = "2.8.7"
okhttp = "4.12.0"
retrofit = "2.11.0"
serialization = "1.7.3"
ktor = "3.5.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
androidx-browser = { module = "androidx.browser:browser", version = "1.8.0" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version = "1.1.0-alpha06" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# The Canvas clip, and every note of the YouTube Music backend. Spotify audio
# still comes from the librespot engine instead.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

# YouTube Music's catalogue and stream URLs (GPL-3.0). InnerTube is not a
# documented API, so this is reverse engineering someone else already maintains
# — the alternative is carrying the signature-cipher chase in this repo.
#
# Keep it current. YouTube breaks extraction deliberately and often: v0.24.6
# still searched fine but every stream answered "The page needs to be reloaded",
# which is what a version a few months stale looks like from here.
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version = "v0.26.4" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
brotli = { module = "org.brotli:dec", version = "0.1.2" }
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }
desugaring = { module = "com.android.tools:desugar_jdk_libs_nio", version = "2.1.5" }
# Metrolist's fork of NewPipeExtractor, which its innertube module is written
# against. Kept alongside the upstream extractor rather than replacing it: the
# anonymous path already works and is what runs when nobody is signed in.
metrolist-extractor = { module = "com.github.MetrolistGroup:MetrolistExtractor", version = "3cd3341" }

coil-compose = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
androidx-palette = { module = "androidx.palette:palette-ktx", version = "1.0.0" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.5" }

# Liquid glass surfaces (Apache-2.0). Compose-native and guarded internally:
# the refraction shader needs API 33, and the library falls back to a plain
# translucent fill below that rather than failing.
backdrop = { module = "io.github.kyant0:backdrop", version = "2.0.0" }
# Capsule and friends, used by the vendored Liquid* components.
kyant-shapes = { module = "io.github.kyant0:shapes", version = "1.2.0" }
# Phosphor (MIT). Apple's SF Symbols are licensed for Apple platforms only, so
# they cannot be used here; Phosphor is the closest set that can, and it carries
# the outline/fill pair this UI already relies on for selected states.
phosphor = { module = "com.adamglin:phosphor-icon", version = "1.0.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
